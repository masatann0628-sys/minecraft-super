<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マインクラフト全画面</title>
    <style>
        /* ページの余白をゼロにして、画面全体をフル活用する */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
        }
        /* iframeを縦横いっぱいに引き延ばす */
        .full-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- iframeでCodePenのプレビュー（Full view）を直接読み込む -->
    <iframe class="full-iframe" src="https://codepen.io/masatann0628-sys/full/01a0e013-461e-7c21-a0b1-353bb411054d" scrolling="no" allowfullscreen="true"></iframe>

</body>
</html>
